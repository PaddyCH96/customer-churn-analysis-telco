name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src dashboard tests
      - run: black --check src dashboard tests
      - run: pytest --cov=telco_churn --cov-report=term-missing
      - name: Reproduce dataset analysis and model evaluation
        run: |
          python -m telco_churn download
          python -m telco_churn analyze
          python -m telco_churn train
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-python-${{ matrix.python-version }}
          path: |
            reports/model_metrics.json
            reports/00_exec_snapshot.csv
